name: Sync ke MEA-Study

on:
  push:
    branches: [main]

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MEA-Library
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validasi semua entry
        run: node scripts/validate.js

      - name: Build index
        run: node scripts/build-index.js

      - name: Checkout MEA-Study
        uses: actions/checkout@v4
        with:
          repository: meaecosystem/MEA-Study
          token: ${{ secrets.MEA_STUDY_PAT }}
          path: mea-study

      - name: Sync folder ke MEA-Study
        run: |
          rm -rf mea-study/knowledge/library
          mkdir -p mea-study/knowledge/library
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ mea-study/knowledge/library/

      - name: Commit dan push ke MEA-Study
        working-directory: mea-study
        run: |
          git config user.name "mea-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge/library
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan, skip commit."
            exit 0
          fi
          git commit -m "sync: update dari MEA-Library (${{ github.sha }})"
          git push
